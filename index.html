<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    background: radial-gradient(circle at top, #ff6b8a, #b1123d);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
  }

  /* Hearts */
  .heart {
    position: absolute;
    bottom: -40px;
    color: #ff1f5a;
    font-size: 28px;
    animation: floatUp linear forwards;
    opacity: 0.9;
    pointer-events: none;
  }

  @keyframes floatUp {
    from {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    to {
      transform: translateY(-120vh) scale(1.4);
      opacity: 0;
    }
  }

  /* Card */
  .card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(14px);
    padding: 45px 40px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    width: 380px;
    z-index: 2;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 18px;
  }

  p {
    font-size: 20px;
    margin-bottom: 35px;
    min-height: 55px;
  }

  .buttons {
    display: flex;
    gap: 18px;
    align-items: center;
  }

  button {
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.25s ease;
  }

  #yes {
    flex: 1;
    background: #ff1f5a;
    color: white;
    font-weight: 700;
    transform: scale(1);
  }

  #no {
    background: rgba(0,0,0,0.4);
    color: white;
    width: 90px;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Hey you 💗</h1>
  <p id="text">Will you be my Valentine?</p>

  <div class="buttons">
    <button id="yes" onclick="yesClick()">Yes 💖</button>
    <button id="no" onclick="noClick()">No 😕</button>
  </div>
</div>

<script>
  /* Bigger floating hearts */
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
  }, 220);

  let yesScale = 1;
  let stage = 0;

  const texts = [
    "Hmm. Think again. 😌",
    "You sure about that? 👀",
    "Because YES is looking good 😏",
    "Okay now it’s obvious 💘",
    "Just press yes already ❤️"

  ];

  function noClick() {
    const yes = document.getElementById("yes");
    const text = document.getElementById("text");

    yesScale += 0.25;
    yes.style.transform = `scale(${yesScale})`;

    if (stage < texts.length) {
      text.textContent = texts[stage];
      stage++;
    }
  }

  function yesClick() {
    document.body.innerHTML = `
      <div style="
        text-align:center;
        font-family:'Montserrat', sans-serif;
        color:white;
      ">
        <h1 style="font-size:40px;">Okay… that was easy 😌</h1>
        <p style="font-size:24px;">Best choice you made today.💗</p>
      </div>
    `;
  }
</script>

</body>
</html>
